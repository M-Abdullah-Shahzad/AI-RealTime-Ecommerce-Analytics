version: '3.9'

services:
  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bda-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    ports:
      - "2181:2181"
    networks:
      - bda-network
    healthcheck:
      test: echo stat | nc localhost 2181
      interval: 10s
      timeout: 10s
      retries: 3

  # Kafka - Message streaming broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bda-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bda-network
    healthcheck:
      test: kafka-broker-api-versions.sh --bootstrap-server localhost:9092 | grep ApiVersion || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

  # BDA Analytics Application
  bda-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bda-analytics-app
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8501:8501"  # Streamlit dashboard
      - "7077:7077"  # Spark master
      - "8080:8080"  # Spark UI
    environment:
      KAFKA_BROKER: kafka:29092
      SPARK_MASTER: local[*]
      PYTHONUNBUFFERED: 1
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    networks:
      - bda-network
    healthcheck:
      test: curl -f http://localhost:8501/_stcore/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bda-network:
    driver: bridge

volumes:
  zookeeper-data:
  kafka-data:
